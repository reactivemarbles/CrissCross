name: BuildDeploy

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release level'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

      channel:
        description: 'Release channel. none = stable RTM; alpha/beta/rc cut a pre-release.'
        required: true
        default: none
        type: choice
        options:
          - none
          - alpha
          - beta
          - rc

      sourceRef:
        description: 'Optional git ref (tag/branch/SHA) to release from. Leave blank to release from this branch.'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  id-token: write
  packages: read

env:
  buildConfiguration: Release
  solutionFile: CrissCross.slnx
  solutionFolder: src
  minMajorMinorVersion: '3.4'

jobs:
  release:
    runs-on: windows-latest
    environment:
      name: release
    outputs:
      semver2: ${{ steps.minver.outputs.NuGetPackageVersion }}
      tag: ${{ steps.tagname.outputs.tag }}
      prerelease: ${{ steps.tagname.outputs.prerelease }}
      sourceSha: ${{ steps.sourcesha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sourceRef }}
          fetch-depth: 0

      - name: Resolve built commit SHA
        id: sourcesha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute release version
        id: release-version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          CHANNEL: ${{ inputs.channel }}
          TAG_PREFIX: v
          MINIMUM_MAJOR_MINOR: ${{ env.minMajorMinorVersion }}
        run: |
          set -euo pipefail

          case "$BUMP" in
            major|minor|patch) ;;
            *)
              echo "::error::bump must be one of major|minor|patch (got '$BUMP')."
              exit 1
              ;;
          esac

          case "$CHANNEL" in
            none) PRE_RELEASE_ID="" ;;
            alpha|beta|rc) PRE_RELEASE_ID="$CHANNEL" ;;
            *)
              echo "::error::channel must be none|alpha|beta|rc (got '$CHANNEL')."
              exit 1
              ;;
          esac

          FLOOR="${MINIMUM_MAJOR_MINOR}.0"
          LAST="$(
            git tag --list "${TAG_PREFIX}[0-9]*.[0-9]*.[0-9]*" \
              | grep -Ev -- '-' \
              | sort -V \
              | tail -1 \
              | sed "s/^${TAG_PREFIX}//" || true
          )"

          BASELINE="$FLOOR"
          if [ -n "$LAST" ]; then
            BASELINE="$(printf '%s\n%s\n' "$FLOOR" "$LAST" | sort -V | tail -1)"
          else
            echo "No RTM tag (${TAG_PREFIX}X.Y.Z) found; using MinVer floor ${FLOOR} as the release baseline."
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$BASELINE"
          case "$BUMP" in
            major) CORE="$((MAJOR + 1)).0.0" ;;
            minor) CORE="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) CORE="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          if [ -n "$PRE_RELEASE_ID" ]; then
            MAXN=0
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue

              number="${tag##*.}"
              case "$number" in
                ''|*[!0-9]*) continue ;;
              esac

              if [ "$number" -gt "$MAXN" ]; then
                MAXN="$number"
              fi
            done < <(git tag --list "${TAG_PREFIX}${CORE}-${PRE_RELEASE_ID}.[0-9]*")

            VERSION="${CORE}-${PRE_RELEASE_ID}.$((MAXN + 1))"
            PRERELEASE=true
          else
            VERSION="$CORE"
            PRERELEASE=false
          fi

          TAG="${TAG_PREFIX}${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists. Refusing to re-release an existing version."
            exit 1
          fi

          echo "Release baseline: ${TAG_PREFIX}${BASELINE} -> next (${BUMP}${PRE_RELEASE_ID:+, ${PRE_RELEASE_ID}}): ${TAG}"

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "MINVERVERSIONOVERRIDE=${VERSION}"
            echo "MinVerVersionOverride=${VERSION}"
          } >> "$GITHUB_ENV"

      - name: Resolve release tag
        id: tagname
        shell: bash
        run: |
          {
            echo "tag=${{ steps.release-version.outputs.tag }}"
            echo "prerelease=${{ steps.release-version.outputs.prerelease }}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
          cache: true
          cache-dependency-path: |
            **/Directory.Packages.props
            **/*.csproj
            **/global.json
            **/nuget.config

      - name: Cache NuGet HTTP v3 feed responses
        uses: actions/cache@v6
        with:
          path: '%LOCALAPPDATA%\NuGet\v3-cache'
          key: ${{ runner.os }}-nugetv3-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '**/global.json', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nugetv3-

      - name: Restore .NET workloads
        shell: bash
        working-directory: ${{ env.solutionFolder }}
        run: |
          dotnet workload install wasm-tools-net10 --skip-manifest-update
          dotnet workload restore ${{ env.solutionFile }} --from-previous-sdk --skip-manifest-update

      - name: Stamp version with MinVer
        id: minver
        uses: reactiveui/actions-common/.github/actions/minver@main
        with:
          tag-prefix: v
          minimum-major-minor: ${{ env.minMajorMinorVersion }}
          auto-increment: minor
          default-pre-release-identifiers: alpha.0
          version-override: ${{ steps.release-version.outputs.version }}

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          vs-prerelease: true

      - name: Build
        uses: reactiveui/actions-common/.github/actions/dotnet-build@main
        env:
          MinVerVersionOverride: ${{ steps.minver.outputs.SemVer2 }}
        with:
          configuration: ${{ env.buildConfiguration }}
          src-folder: ${{ env.solutionFolder }}
          solution-file: ${{ env.solutionFile }}
          create-packages: 'false'

      - name: Pack unsigned NuGet packages
        shell: bash
        working-directory: ${{ env.solutionFolder }}
        env:
          MinVerVersionOverride: ${{ steps.minver.outputs.SemVer2 }}
        run: dotnet pack --no-restore --configuration "${{ env.buildConfiguration }}" ${{ env.solutionFile }} -o "${GITHUB_WORKSPACE}/packages" -p:MinVerVersionOverride="${{ steps.minver.outputs.SemVer2 }}"

      - name: Upload unsigned packages
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-nuget
          path: |
            packages/*.nupkg
            !packages/*.symbols.nupkg
          if-no-files-found: error

  sign:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
    steps:
      - name: Checkout signing setup
        uses: actions/checkout@v7

      - name: Download unsigned packages
        uses: actions/download-artifact@v8
        with:
          name: unsigned-nuget
          path: signed

      - name: Setup .NET for package verification
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup ssign package signing
        id: signing-tools
        uses: ./.github/actions/setup-ssign

      - name: Sign and verify NuGet packages with ssign
        timeout-minutes: 15
        shell: bash
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_USER_ID }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP_URI }}
          CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}
          SSIGN_MODULE: ${{ steps.signing-tools.outputs.module-path }}
          JSIGN_JAR: ${{ steps.signing-tools.outputs.jsign-jar }}
        run: |
          set -euo pipefail
          : "${CERTUM_EMAIL:?map the CERTUM_USER_ID secret into the release environment}"
          : "${CERTUM_OTP:?map the CERTUM_OTP_URI secret into the release environment}"
          : "${CERTUM_CERT_FINGERPRINT:?map the CERTUM_CERT_FINGERPRINT secret into the release environment}"

          # ssign shares the authenticated session between package invocations.
          # Keep its bearer-token cache private and remove it before leaving.
          export XDG_RUNTIME_DIR
          XDG_RUNTIME_DIR="$(mktemp -d "$RUNNER_TEMP/ssign-session.XXXXXX")"
          trap 'rm -rf -- "$XDG_RUNTIME_DIR"' EXIT
          umask 077
          CONF="$XDG_RUNTIME_DIR/sunpkcs11.conf"
          {
            echo 'name = ssign'
            echo "library = $SSIGN_MODULE"
            echo 'slotListIndex = 0'
          } > "$CONF"

          expected_fingerprint="$(printf '%s' "$CERTUM_CERT_FINGERPRINT" | tr -d '[:space:]:')"
          if [[ ! "$expected_fingerprint" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo '::error::CERTUM_CERT_FINGERPRINT must be the signer certificate SHA256 fingerprint.'
            exit 1
          fi
          shopt -s nullglob
          pkgs=( signed/*.nupkg )
          [ "${#pkgs[@]}" -gt 0 ] || { echo '::error::no packages matched: signed/*.nupkg'; exit 1; }
          for pkg in "${pkgs[@]}"; do
            echo "::group::sign $pkg"
            java -jar "$JSIGN_JAR" --storetype PKCS11 --keystore "$CONF" --storepass '' \
              --alg SHA-256 --tsmode RFC3161 --tsaurl http://time.certum.pl --replace "$pkg"
            dotnet nuget verify "$pkg" --all --certificate-fingerprint "$expected_fingerprint" --verbosity detailed
            echo '::endgroup::'
          done

      - name: Upload signed packages
        uses: actions/upload-artifact@v7
        with:
          name: signed-nuget
          path: |
            signed/*.nupkg
            !signed/*.symbols.nupkg
          if-no-files-found: error

  publish-nuget:
    needs: [release, sign]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      id-token: write
    steps:
      - name: Download signed packages
        uses: actions/download-artifact@v8
        with:
          name: signed-nuget
          path: signed

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: NuGet login (OIDC trusted publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=(./signed/*.nupkg)
          [ "${#packages[@]}" -gt 0 ] || { echo "::error::no publishable packages matched: ./signed/*.nupkg"; exit 1; }

          for pkg in "${packages[@]}"; do
            dotnet nuget push "$pkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done

  create-release:
    needs: [release, publish-nuget]
    uses: reactiveui/actions-common/.github/workflows/workflow-common-create-release.yml@main
    with:
      version: ${{ needs.release.outputs.semver2 }}
      tag: ${{ needs.release.outputs.tag }}
      target: ${{ needs.release.outputs.sourceSha }}
      prerelease: ${{ needs.release.outputs.prerelease == 'true' }}
      artifactName: signed-nuget
